services:
  pallasync:
    build:
      context: .
      dockerfile: Dockerfile
    image: pallasync-server:local
    restart: unless-stopped
    init: true
    environment:
      PORT: "3000"
      DATABASE_URL: sqlite:///data/pallasync.sqlite
      URL: "${PALLASYNC_CORS_ORIGIN:-*}"
    ports:
      - "${PALLASYNC_HOST_PORT:-3000}:3000"
    volumes:
      - pallasync-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pallasync-data:
