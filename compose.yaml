services:
  pallasync:
    build:
      context: .
      dockerfile: Dockerfile
    image: pallasync-server:local
    restart: unless-stopped
    init: true
    environment:
      PALLASYNC_BIND_ADDR: "0.0.0.0:3000"
      DATABASE_URL: sqlite:///data/pallasync.sqlite
      PALLASYNC_RELAY_SIGNING_SEED: "${PALLASYNC_RELAY_SIGNING_SEED:-}"
      PALLASYNC_PRIVACY_MARKDOWN: /policy/privacy.md
      PALLASYNC_PRIVACY_JSON: /policy/privacy.json
    ports:
      - "127.0.0.1:${PALLASYNC_HOST_PORT:-3000}:3000"
    volumes:
      - pallasync-data:/data
      - "${PALLASYNC_OPERATOR_DIR:?Set the populated operator policy directory}:/policy:ro"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pallasync-data:
